# =============================================================================
# DocuRisk AI — Spring Boot Application Properties
# =============================================================================

spring.application.name=docurisk-backend
server.port=8080

# -----------------------------------------------------------------------------
# Database Configuration (MySQL 8.0+)
# -----------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/docurisk_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:docurisk_user}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -----------------------------------------------------------------------------
# JPA / Hibernate Configuration
# -----------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# -----------------------------------------------------------------------------
# File Upload Limits (Supporting PDFs and DOCX contracts up to 25MB)
# -----------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# -----------------------------------------------------------------------------
# AI Service Integration (FastAPI Microservice)
# -----------------------------------------------------------------------------
ai-service.url=${AI_SERVICE_URL:http://localhost:8000}

# -----------------------------------------------------------------------------
# CORS Allowed Origins
# -----------------------------------------------------------------------------
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
